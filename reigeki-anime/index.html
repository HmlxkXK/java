<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 移动端浏览器会把地址栏也染成这个色，和页面的暗色背景连成一片 -->
    <meta name="theme-color" content="#0c0710" />
    <meta name="description" content="燃尽动漫 —— 追番、社区、同好公会，把你的热爱烧到最旺。" />
    <!-- 深色界面下让浏览器自带的表单/滚动条按深色渲染 -->
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>燃尽动漫</title>
  </head>
  <body>
    <div id="app"></div>
    <!-- 纯前端应用，脚本被禁用时页面会一片空白，这里给出说明 -->
    <noscript>燃尽动漫需要启用 JavaScript 才能运行，请在浏览器设置中开启后刷新页面。</noscript>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>

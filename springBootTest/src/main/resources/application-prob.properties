server.port=8082

# ==================== reigeki-anime production-like profile ====================
# NOTE: comments are ASCII-only, for the reason explained in application-dev.
# NOTE: the file name is spelled "prob" (likely a typo for "prod"). It is left
#       as-is so that an existing -Dspring.profiles.active=prob command line
#       keeps working; rename it if you want the conventional spelling.
#
# Before this profile had no datasource at all, so activating it aborted
# startup with "Failed to determine a suitable driver class". It now defines
# the full production posture; pool tuning is inherited from
# application.properties.
#
# Every value below is expected to come from the environment in real
# deployments. The defaults only exist so the profile still boots locally.

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/reigeki_anime?createDatabaseIfNotExist=false&useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&zeroDateTimeBehavior=CONVERT_TO_NULL&autoReconnect=false&useServerPrepStmts=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&cacheResultSetMetadata=true&cacheServerConfiguration=true&useLocalSessionState=true&elideSetAutoCommits=true&maintainTimeStats=false&rewriteBatchedStatements=true&tcpKeepAlive=true&connectTimeout=10000&socketTimeout=60000}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Schema is owned by sql/reigeki_anime.sql (or a migration tool). MyBatis-Plus
# never alters the schema at runtime, so "validate" is the default posture.
# No SQL echoing in prod, and no dev-only leak detector (it captures stack
# traces) -- leak-detection-threshold stays at the default 0.

# ---------- Video streaming ----------
# In deployment this MUST point at a dedicated disk path, not ./videos.
app.video.dir=${VIDEO_DIR:videos}

# A real secret must be injected; there is no usable default here on purpose.
app.jwt.secret=${JWT_SECRET:reigeki-anime-jwt-secret-key-2026-change-me-in-production}
app.jwt.expire-hours=24

app.auth.code-ttl-seconds=300
app.auth.code-length=6

server.port=8081

# ==================== reigeki-anime backend config ====================
# NOTE: comments in this file are kept ASCII on purpose.
# Java .properties files are loaded with a non-UTF8 charset on some Windows
# setups, and non-ASCII comments would show up garbled.

# ---------- MySQL datasource ----------
# Credentials fall back to the local dev values but can be overridden without
# editing this file, e.g.  set DB_PASSWORD=xxx   (or -DDB_PASSWORD=xxx).
#
# URL parameters, explained:
#   createDatabaseIfNotExist=true   schema is created on first start, no manual
#                                   CREATE DATABASE step needed (needs CREATE grant)
#   characterEncoding=UTF-8         a *Java* charset name, NOT the MySQL
#                                   collation name utf8mb4 -- Connector/J 8+
#                                   negotiates utf8mb4 from UTF-8
#   serverTimezone=Asia/Shanghai    resolves TIMESTAMP values in local time
#   allowPublicKeyRetrieval=true    required for caching_sha2_password over a
#                                   non-SSL connection (MySQL 8 default plugin)
#   zeroDateTimeBehavior=CONVERT_TO_NULL
#                                   maps the all-zero date to null instead of
#                                   throwing on a legacy column
#   autoReconnect=false             reconnect is Hikari's job; the driver's own
#                                   autoReconnect is deprecated and loses
#                                   session state
#
# The remaining flags are the Connector/J performance set: prepare statements
# server-side and reuse the handle, skip round-trips the driver can already
# answer from local session state, and let the driver collapse a JDBC batch
# into one multi-row statement.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/reigeki_anime?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&zeroDateTimeBehavior=CONVERT_TO_NULL&autoReconnect=false&useServerPrepStmts=true&cachePrepStmts=true&prepStmtCacheSize=250&prepStmtCacheSqlLimit=2048&cacheResultSetMetadata=true&cacheServerConfiguration=true&useLocalSessionState=true&elideSetAutoCommits=true&maintainTimeStats=false&rewriteBatchedStatements=true&tcpKeepAlive=true&connectTimeout=10000&socketTimeout=60000}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# HikariCP pool sizing / lifetime tuning now lives in application.properties so
# the test and prob profiles inherit it too. Only dev-only extras stay here:
# a 20s leak threshold logs a stack trace when a connection is held that long,
# which catches a missing @Transactional or an unclosed stream while developing.
spring.datasource.hikari.leak-detection-threshold=20000

# ---------- JPA / Hibernate ----------
# update -> create/alter tables to match the entity, never drops data
spring.jpa.hibernate.ddl-auto=update
# show-sql is a dev-only concern; prod uses validate and stays quiet.
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ---------- JWT ----------
# HS256 requires a key of at least 256 bits (32 ASCII chars). Change it in prod.
app.jwt.secret=${JWT_SECRET:reigeki-anime-jwt-secret-key-2026-change-me-in-production}
app.jwt.expire-hours=24

# ---------- Email verification code ----------
app.auth.code-ttl-seconds=300
app.auth.code-length=6

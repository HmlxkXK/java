spring.application.name=springBootTest
spring.profiles.active=dev

# =====================================================================
# NOTE: every comment in this file is intentionally ASCII-only.
# Java .properties files are read with ISO-8859-1 by the spec (and with
# the platform charset by some Windows setups), so non-ASCII comments end
# up garbled. The previous Chinese comments in this file were already
# destroyed into literal "?" characters -- keep them ASCII from now on.
# =====================================================================

# ---------------- Logging ----------------
logging.level.root=info
# Was "com.fengling.springboot", which matches no package in this project,
# so the line silently did nothing and the app logged at root level.
# The real base package is com.fenglin.springboottest.
logging.level.com.fenglin.springboottest=info
logging.file.name=log/xx.log
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss}  %level %logger{50}.%M %L:%m%n
logging.pattern.file=%d{yyyy-MM-dd HH:mm:ss}  %level %logger{50}.%M %L:%m%n

# =====================================================================
# Datasource / JPA tuning -- SHARED by every profile.
# These used to live in application-dev.properties, so switching to
# test / prob silently dropped all pool tuning. Now only the environment
# specific bits (url / credentials / ddl-auto) stay in the profile files.
# =====================================================================

spring.datasource.type=com.zaxxer.hikari.HikariDataSource

# ---------------- HikariCP ----------------
spring.datasource.hikari.pool-name=ReigekiHikariPool

# Pool sizing. Server-side max_connections is 151 (MySQL 8.0 default), so a
# single instance sized at 20 still leaves plenty of headroom for other tools.
# Formula from the HikariCP wiki: connections = (core_count * 2) + spindle_count.
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5

# Fail fast instead of hanging the request thread when the DB is unreachable.
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.validation-timeout=3000
# Give MySQL up to 10s to come up before aborting startup (handy on cold boot
# when app and database are launched together). A positive value also makes
# Hikari acquire one connection eagerly, so a bad URL/password fails at boot.
spring.datasource.hikari.initialization-fail-timeout=10000

# Connection lifetime management. MySQL's wait_timeout is 28800s (8h), and
# Hikari requires: keepalive-time < max-lifetime, idle-timeout < max-lifetime.
# Recycling every 30min keeps us far away from the server-side idle kill,
# which is the classic cause of "the first request after idle is slow/fails".
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.keepalive-time=300000

# ---------------- JPA / Hibernate ----------------
# open-in-view=false: keeps the EntityManager closed outside @Transactional,
# so a lazily-loaded field cannot silently fire SQL while rendering.
spring.jpa.open-in-view=false

# Batch DML. Combined with rewriteBatchedStatements=true in the JDBC URL this
# turns N single-row INSERTs into one multi-row statement.
spring.jpa.properties.hibernate.jdbc.batch_size=50
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# Load lazy collections in batches (IN (...) chunks) instead of one query
# per parent row -- the standard N+1 mitigation.
spring.jpa.properties.hibernate.default_batch_fetch_size=50

# Pad IN (...) lists to a fixed set of lengths so MySQL can reuse one
# execution plan instead of flooding the plan cache with variants.
spring.jpa.properties.hibernate.query.in_clause_parameter_padding=true

# Pin the JDBC timezone so the meaning of a timestamp does not depend on the
# JVM default. No effect on LocalDateTime columns, but prevents a classic
# off-by-hours bug the moment an Instant / audit field is added.
spring.jpa.properties.hibernate.jdbc.time_zone=Asia/Shanghai

# hibernate.dialect is deliberately NOT set: Hibernate 6 auto-detects the
# server version from JDBC metadata and picks the matching MySQL dialect
# (including its version-specific SQL). Pinning it by hand only downgrades it.
